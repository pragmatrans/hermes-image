name: build

# Manual dispatch is the ONLY path: a push to main with empty inputs computes
# tag = v<base> and silently overwrites the tag prod runs (and the rollback target).
# Build with: gh workflow run build --ref <branch> -f tag=v<base>-<label>
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base image (tag@sha256:…); empty = the digest from the Dockerfile'
        required: false
        default: ''
      tag:
        description: 'Tag for our image (empty = v<version from the base tag>)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 (our Mac) on an amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          base='${{ inputs.base }}'
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            if [ -n "$base" ]; then tag="${base%%@*}"; tag="${tag##*:}"; else tag=v0.22.7; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then echo "args=BASE=$base" >> "$GITHUB_OUTPUT"; else echo "args=" >> "$GITHUB_OUTPUT"; fi
          echo "building: $tag"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ steps.meta.outputs.args }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runtime smoke test on the pushed amd64 image: the tool layer is verified at build
  # time, but only running the image proves we did not break the s6 entrypoint/CMD.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tools and runtime are alive
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}"
          docker pull --platform linux/amd64 "$IMG"
          docker run --rm -i --platform linux/amd64 --entrypoint /bin/sh "$IMG" <<'SH'
          set -e
          for b in pdftotext zbarimg qrencode git-lfs sqlite3 gh jq python3; do
            command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }
          done
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'
          git lfs version
          test "$(sqlite3 :memory: 'select 42')" = "42"   # --version мовчить про ABI-mismatch
          test "$(pdftotext -v 2>&1 | head -1 | cut -d' ' -f3)" != ""
          /opt/hermes/bin/hermes --version
          SH
