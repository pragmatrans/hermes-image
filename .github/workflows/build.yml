name: build

# Ручний запуск — основний шлях: збираємо, коли оновили Hermes і перевірили, що працює.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Базовий образ (tag@sha256:…), порожньо = дефолт із Dockerfile'
        required: false
        default: ''
      tag:
        description: 'Тег для нашого образу (порожньо = v<версія з базового тегу>)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 (наш Mac) на amd64-раннері
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Обчислити теги
        id: meta
        run: |
          base='${{ inputs.base }}'
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            if [ -n "$base" ]; then tag="${base%%@*}"; tag="${tag##*:}"; else tag=v0.22.7; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then echo "args=BASE=$base" >> "$GITHUB_OUTPUT"; else echo "args=" >> "$GITHUB_OUTPUT"; fi
          echo "збірка: $tag"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ steps.meta.outputs.args }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
